# Local development services. Credentials below are dev-only defaults;
# override them with environment variables (e.g. in a local .env file).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      # The official image makes this user a superuser, so `prisma migrate dev`
      # can create its temporary shadow database.
      POSTGRES_USER: ${POSTGRES_USER:-nutritio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nutritio}
      POSTGRES_DB: ${POSTGRES_DB:-nutritio}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nutritio} -d ${POSTGRES_DB:-nutritio}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Web-based database client: http://localhost:8080
  adminer:
    image: adminer:5
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
